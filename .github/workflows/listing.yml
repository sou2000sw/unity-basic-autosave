name: Listing

# Rebuilds the VPM listing (index.json) from all releases and deploys it to GitHub Pages.
# workflow_run runs on the default branch, which the github-pages environment allows
# (a run on the tag ref would be refused by its deployment rules).
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  listing:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build index.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/build_listing.py site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
